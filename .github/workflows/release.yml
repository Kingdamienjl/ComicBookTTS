name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

env:
  JAVA_VERSION: '17'
  ANDROID_COMPILE_SDK: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Create config.properties
      run: |
        if [ -f "config.properties.template" ]; then
          cp config.properties.template config.properties
        else
          echo "# ComicBookTTS Configuration" > config.properties
          echo "app_name=ComicBookTTS" >> config.properties
          echo "version=${{ github.ref_name || inputs.version }}" >> config.properties
        fi
        
    - name: Run tests
      run: ./gradlew testDebugUnitTest
      
    - name: Build release APK
      run: ./gradlew assembleRelease
      
    - name: Sign APK
      if: env.KEYSTORE_FILE != ''
      run: |
        echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > keystore.jks
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
          -keystore keystore.jks \
          -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
          -keypass "${{ secrets.KEY_PASSWORD }}" \
          app/build/outputs/apk/release/app-release-unsigned.apk \
          "${{ secrets.KEY_ALIAS }}"
        mv app/build/outputs/apk/release/app-release-unsigned.apk \
           app/build/outputs/apk/release/ComicBookTTS-${{ github.ref_name || inputs.version }}.apk
      env:
        KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        
    - name: Rename unsigned APK (if not signed)
      if: env.KEYSTORE_FILE == ''
      run: |
        mv app/build/outputs/apk/release/app-release-unsigned.apk \
           app/build/outputs/apk/release/ComicBookTTS-${{ github.ref_name || inputs.version }}-unsigned.apk
      env:
        KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        
    - name: Generate changelog
      id: changelog
      run: |
        if [ -f "CHANGELOG.md" ]; then
          # Extract changelog for current version
          awk '/^## \[?'"${{ github.ref_name || inputs.version }}"'\]?/{flag=1; next} /^## /{flag=0} flag' CHANGELOG.md > current_changelog.md
          if [ -s current_changelog.md ]; then
            echo "changelog<<EOF" >> $GITHUB_OUTPUT
            cat current_changelog.md >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "changelog=Release ${{ github.ref_name || inputs.version }}" >> $GITHUB_OUTPUT
          fi
        else
          echo "changelog=Release ${{ github.ref_name || inputs.version }}" >> $GITHUB_OUTPUT
        fi
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name || inputs.version }}
        name: ComicBookTTS ${{ github.ref_name || inputs.version }}
        body: |
          ## ComicBookTTS Release ${{ github.ref_name || inputs.version }}
          
          ### Features
          - 📚 Advanced OCR text recognition for comic books
          - 🎙️ High-quality Android TTS narration
          - 📖 Support for CBZ, CBR, PDF, and image formats
          - 🔍 ML Kit powered text recognition with comic-optimized preprocessing
          - ⚡ Performance optimizations and caching
          
          ### Changes
          ${{ steps.changelog.outputs.changelog }}
          
          ### Installation
          1. Download the APK file below
          2. Enable "Install from unknown sources" in Android settings
          3. Install the APK on your Android device
          
          ### Requirements
          - Android 7.0 (API level 24) or higher
          - 50MB free storage space
          - Internet connection for initial setup
        files: |
          app/build/outputs/apk/release/ComicBookTTS-*.apk
        draft: false
        prerelease: ${{ contains(github.ref_name || inputs.version, 'beta') || contains(github.ref_name || inputs.version, 'alpha') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Deploy release to Vercel
      run: |
        npm install -g vercel@latest
        vercel --token ${{ secrets.VERCEL_TOKEN }} --prod --yes
      env:
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      if: env.VERCEL_TOKEN != ''
        
    - name: Notify deployment
      run: |
        echo "✅ Release ${{ github.ref_name || inputs.version }} deployed successfully!"
        echo "📱 APK: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name || inputs.version }}"
        echo "🌐 Web: https://comicbook-tts.vercel.app/"